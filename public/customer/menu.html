<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu — SbyNhamHub</title>
  <meta name="description" content="Browse the SbyNhamHub menu — starters, mains, grills & seafood, desserts and drinks.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="/menu">

  <header class="nav" id="nav"></header>

  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">SbyNhamHub · The Menu</p>
      <h1 data-i18n-html="hero.menu">Eat <span class="italic-accent">better.</span></h1>
      <p class="lede">Seasonal Southeast-Asian cooking, made from scratch each day. Filter by category, or just trust the chef.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filter-bar" id="filterBar">
        <button class="filter-chip active" data-cat="">All dishes</button>
      </div>
      <div class="grid-3" id="menuGrid">
        <div class="card-tile" style="padding:60px;text-align:center;grid-column:1/-1">
          <p class="muted">Loading the menu…</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="card-tile" style="padding:34px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap">
        <div>
          <h3 style="margin:0 0 6px">Hungry already?</h3>
          <p class="muted" style="margin:0">Reserve a table and we'll keep your favourites warm.</p>
        </div>
        <a class="btn btn-primary btn-lg" href="/book">Book a table</a>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script>
    (function () {
      const filterBar = document.getElementById('filterBar');
      const grid = document.getElementById('menuGrid');
      let items = [];
      let current = '';
      let saved = new Set();

      Promise.all([fetch('/api/menu').then((r) => r.json()), fetch('/api/categories').then((r) => r.json())])
        .then(([menu, cats]) => {
          items = menu;
          const chips = [
            { slug: '', name: 'All dishes' },
            ...cats.map((c) => ({ slug: c.slug, name: c.name }))
          ];
          filterBar.innerHTML = chips
            .map((c) => `<button class="filter-chip ${c.slug === '' ? 'active' : ''}" data-cat="${escapeHTML(c.slug)}">${escapeHTML(c.name)}</button>`)
            .join('');
          filterBar.addEventListener('click', (e) => {
            const chip = e.target.closest('.filter-chip');
            if (!chip) return;
            current = chip.dataset.cat;
            filterBar.querySelectorAll('.filter-chip').forEach((c) => c.classList.toggle('active', c === chip));
            render();
          });
          return loadSaves().then(() => render());
        })
        .catch(() => {
          grid.innerHTML = '<div class="card-tile" style="padding:60px;text-align:center;grid-column:1/-1"><p class="muted">Could not load the menu. Please try again later.</p></div>';
        });
      document.addEventListener('localechange', render);

      function loadSaves() {
        const params = guestIdentityParam();
        if (!params.toString()) return Promise.resolve();
        return fetch(`/api/saves?${params.toString()}`)
          .then((r) => r.json())
          .then((data) => {
            saved = new Set((data.items || []).map((i) => Number(i.id)));
          })
          .catch(() => {});
      }

      async function toggleSave(d) {
        const identity = await ensureGuestIdentity();
        if (!identity) return;
        const params = guestIdentityParam();
        const isSaved = saved.has(Number(d.id));
        try {
          if (isSaved) {
            await api(`/api/saves?${params.toString()}`, { method: 'DELETE', body: JSON.stringify({ item_id: d.id }) });
            saved.delete(Number(d.id));
            toast('Removed from your favourites', 'success');
          } else {
            await api('/api/saves', { method: 'POST', body: JSON.stringify({ item_id: d.id, ...identity }) });
            saved.add(Number(d.id));
            toast('Saved to your favourites', 'success');
          }
          render();
        } catch (err) {
          toast(err.message, 'error');
        }
      }

      function render() {
        const shown = current ? items.filter((d) => d.category_slug === current) : items;
        if (!shown.length) {
          grid.innerHTML = '<div class="card-tile" style="padding:60px;text-align:center;grid-column:1/-1"><p class="muted">No dishes in this category yet.</p></div>';
          return;
        }
        grid.innerHTML = shown.map((d) => `
          <article class="dish">
            <div class="dish-img"><img src="/assets/img/${escapeHTML(d.image)}" alt="${escapeHTML(d.name)}"></div>
            <div class="dish-body">
              <div class="dish-top">
                <h3 class="dish-name">${escapeHTML(d.name)}</h3>
                <span class="dish-price">${money(d.price)}</span>
              </div>
              <p class="dish-desc">${escapeHTML(d.description)}</p>
              <div class="dish-meta">
                ${d.tag ? `<span class="badge badge-gold">${escapeHTML(d.tag)}</span>` : ''}
                <span class="badge badge-brand">${escapeHTML(d.category)}</span>
                <button class="dish-save ${saved.has(Number(d.id)) ? 'saved' : ''}" data-save="${escapeHTML(d.id)}" aria-label="Save ${escapeHTML(d.name)} to favourites" title="Save to favourites">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="${saved.has(Number(d.id)) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                </button>
              </div>
            </div>
          </article>
        `).join('');
        grid.querySelectorAll('.dish-save').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const item = items.find((d) => Number(d.id) === Number(btn.dataset.save));
            if (item) toggleSave(item, btn);
          });
        });
      }
    })();
  </script>
</body>
</html>
